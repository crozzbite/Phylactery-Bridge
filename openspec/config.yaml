schema: spec-driven

context: |
  Tech stack: Monorepo (NestJS backend + Angular/Ionic frontend, Bun scripts, TypeScript)
  Architecture: API backend plus SPA frontend with separate packages
  Testing: Jest (backend), Karma/Jasmine (frontend), e2e/int scripts in backend
  Style: ESLint + Prettier (backend), Angular CLI conventions (frontend)

strict_tdd: true

testing:
  detected: "2026-04-23"
  strict_tdd: true
  test_runner:
    command: "bun run test:backend (or bun run test:frontend)"
    framework: "Jest (backend), Karma/Jasmine (frontend)"
  layers:
    unit:
      available: true
      tool: "Jest, Karma"
    integration:
      available: true
      tool: "Jest + Supertest"
    e2e:
      available: true
      tool: "Jest e2e config (backend)"
  coverage:
    available: true
    command: "cd backend && bun run test:cov"
  quality_tools:
    linter:
      available: true
      command: "cd backend && bun run lint"
    type_checker:
      available: true
      command: "cd backend && npx tsc --noEmit"
    formatter:
      available: true
      command: "cd backend && bun run format"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
